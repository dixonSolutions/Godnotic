# The live channels between releases: their manifests must name this app, stay signed, and pass the
# host's checks.
#
# Clients reject an expired manifest, and a live channel's signature lasts 30 days. Releases sign
# it, so re-signing only has work to do when no release has shipped for a while. A manifest that
# names another app id (the live channels kept their pre-rename id until 2026-11) is rewritten to
# andysu.toml's id and re-signed. Every run then checks each channel as an installed host would and
# fails if a host would refuse it.
#
# Dispatch from main to repair the channels at once, without a release:
#   gh workflow run resign-live.yml --repo dixonSolutions/Godnotic --ref main
#
# Not in the release concurrency group: GitHub keeps one pending run per group, so a scheduled run
# could cancel a queued release. This skips while a release is active (its live jobs repair and
# check the channels themselves) and tries again next week, well before the 14-day margin runs out.
name: resign-live
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Re-sign even if the manifest has plenty of time left
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: resign-live
  cancel-in-progress: false

env:
  ANDYSU_VERSION: 0.1.141

jobs:
  resign:
    # Signs with the release key: only main's copy of these scripts may do that.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [arm64, arm32, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Stand down while a release is running
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active=$(gh run list --workflow build-and-publish.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "active=$active" >> "$GITHUB_OUTPUT"
          if [ "$active" != 0 ]; then
            echo "::notice::a release is active; its live jobs repair, sign and check the channels"
          fi
      - name: Fetch the pinned AndySU CLI
        if: steps.busy.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Through the API and retried: anonymous releases/download URLs time out (504) whenever
          # GitHub sheds anonymous load.
          for i in 1 2 3 4 5 6; do
            gh release download "v$ANDYSU_VERSION" --repo dixonSolutions/AndySU --dir "$RUNNER_TEMP" --clobber \
              --pattern andysu-x86_64-unknown-linux-musl && break
            test "$i" -lt 6
            sleep $((i * 15))
          done
          mv "$RUNNER_TEMP/andysu-x86_64-unknown-linux-musl" "$RUNNER_TEMP/andysu"
          chmod +x "$RUNNER_TEMP/andysu"
          gh api "repos/dixonSolutions/AndySU/contents/scripts/resign-channel.sh?ref=v$ANDYSU_VERSION" \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/resign-channel.sh"
      - name: Make the channel manifest name this app
        if: steps.busy.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: live-${{ matrix.suffix }}
          ANDYSU_SIGNING_KEY: ${{ secrets.ANDYSU_SIGNING_KEY }}
          ANDYSU_SIGNING_CERT: ${{ secrets.ANDYSU_SIGNING_CERT }}
        run: ANDYSU_CLI="$RUNNER_TEMP/andysu" bash scripts/andysu-channel.sh gh-repair "$CHANNEL"
      - name: Re-sign the channel if it is close to expiry
        if: steps.busy.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: live-${{ matrix.suffix }}
          ANDYSU_SIGNING_KEY: ${{ secrets.ANDYSU_SIGNING_KEY }}
          ANDYSU_SIGNING_CERT: ${{ secrets.ANDYSU_SIGNING_CERT }}
          MIN_DAYS: ${{ inputs.force && '31' || '14' }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          mkdir -p "$site/$CHANNEL"
          gh release download "channel-$CHANNEL" --repo "$GITHUB_REPOSITORY" --dir "$site/$CHANNEL" --pattern 'update.json*'
          before=$(sha256sum "$site/$CHANNEL/update.json")
          umask 077
          printf '%s\n' "$ANDYSU_SIGNING_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$ANDYSU_SIGNING_CERT" > "$RUNNER_TEMP/cert.json"
          trap 'rm -f "$RUNNER_TEMP/key" "$RUNNER_TEMP/cert.json"' EXIT
          ANDYSU_CLI="$RUNNER_TEMP/andysu" ANDYSU_KEY_FILE="$RUNNER_TEMP/key" ANDYSU_CERT_FILE="$RUNNER_TEMP/cert.json" \
            sh "$RUNNER_TEMP/resign-channel.sh" "$site" "$CHANNEL" keys/godnotic-public.pem
          if [ "$before" != "$(sha256sum "$site/$CHANNEL/update.json")" ]; then
            gh release upload "channel-$CHANNEL" --repo "$GITHUB_REPOSITORY" --clobber \
              "$site/$CHANNEL/update.json" "$site/$CHANNEL/update.json.sig"
          fi
      - name: Check the channel as an installed host would
        if: steps.busy.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: live-${{ matrix.suffix }}
        run: ANDYSU_CLI="$RUNNER_TEMP/andysu" bash scripts/andysu-channel.sh gh-check "$CHANNEL"
      - name: The release key's certificate is not about to run out
        env:
          ANDYSU_SIGNING_CERT: ${{ secrets.ANDYSU_SIGNING_CERT }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys
          until = json.loads(os.environ["ANDYSU_SIGNING_CERT"])["not_after"].replace("Z", "+00:00")
          left = (datetime.datetime.fromisoformat(until) - datetime.datetime.now(datetime.timezone.utc)).days
          print(f"certificate valid for {left} more days")
          if left < 30:
              print(f"::error::the release key certificate expires in {left} days; certify a new one")
              sys.exit(1)
          PY
