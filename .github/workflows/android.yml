name: Android

on:
  push:
    # main goes through build-and-publish.yml, which calls this workflow —
    # keeping '**' here would build every APK twice on every release commit.
    branches-ignore: [main, master]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version name stamped into the APK
        type: string
        required: true
      version_code:
        description: Monotonic Android versionCode
        type: string
        required: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.3.13750724

jobs:
  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # `secrets` is not a context step-level `if` can read; hoist the check.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64: Waydroid, Chromebooks, the emulator -- and how the
        # self-updater gets exercised on a desktop before a release.
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          CODE="${{ inputs.version_code }}"
          # Branch builds carry no workflow_call inputs but still need a code.
          [ -n "$VERSION" ] || VERSION="1.2.${{ github.run_number }}"
          [ -n "$CODE" ] || CODE="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential make gcc g++ pkg-config git \
            cmake ninja-build imagemagick zip unzip curl xz-utils \
            libgmp-dev ccache

      # The engine's CMake build wraps the NDK compiler in ccache when it is
      # on PATH. Per-commit key with a prefix fallback: every run restores
      # the newest cache and saves its own (an exact hit is never re-saved).
      - name: Cache ccache (engine)
        uses: actions/cache@v4
        with:
          # A literal path: `env:` values are not shell-expanded, so a ~ in
          # CCACHE_DIR would have ccache write to a directory named "~".
          path: ${{ github.workspace }}/.ccache
          key: xonotic-android-ccache-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('engine/**', 'android/**') }}
          restore-keys: |
            xonotic-android-ccache-${{ matrix.abi }}-${{ env.NDK_VERSION }}-

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache native dependency sources
        uses: actions/cache@v4
        with:
          path: build/android/src
          key: xonotic-android-src-v1-${{ hashFiles('scripts/android-deps.sh') }}

      - name: Cache compiled native dependencies
        uses: actions/cache@v4
        with:
          path: build/android/prefix/${{ matrix.abi }}
          key: xonotic-android-prefix-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/android-deps.sh') }}

      # The Rust loader core (loader/crates/android) for this ABI; android-build.sh
      # builds it with GODNOTIC_RUST_CORE=1 and fails without it.
      - name: Rust toolchain
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a) t=aarch64-linux-android ;; armeabi-v7a) t=armv7-linux-androideabi ;;
            x86_64) t=x86_64-linux-android ;; x86) t=i686-linux-android ;;
          esac
          rustup toolchain install stable --profile minimal
          rustup target add "$t"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/android/cargo-target
          key: godnotic-android-cargo-${{ matrix.abi }}-${{ hashFiles('loader/Cargo.lock') }}
          restore-keys: |
            godnotic-android-cargo-${{ matrix.abi }}-

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build/android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/android/release.keystore
          echo "ANDROID_KEYSTORE=$PWD/build/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_ABI: ${{ matrix.abi }}
          GODNOTIC_RUST_CORE: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/build/android/cargo-target
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
          PROJECT_VERSION: ${{ steps.ver.outputs.version }}
          PROJECT_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/android-build.sh

      - name: Show APK metadata
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          ccache -s 2>/dev/null | head -12 || true
          APK="$(find build/android-out -name '*.apk' | head -1)"
          ls -lh "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort -r | head -1)"
          "$AAPT" dump badging "$APK" | head -15 || true
          unzip -l "$APK" | grep -E 'lib/|assets/' | head -10

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: build/android-out/*.apk
          if-no-files-found: error

  smoke:
    name: Boot x86_64 APK
    needs: apk
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The publishing workflow also runs for documentation-only commits.
      - name: Check for non-documentation changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run_smoke=true
          if [ "$EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -Ev '^(docs/|README\.md$)' | grep -q .; then
              run_smoke=false
            fi
          fi
          echo "run=$run_smoke" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.changes.outputs.run == 'true'
        with:
          name: android-x86_64
          path: apk

      - uses: android-actions/setup-android@v3
        if: steps.changes.outputs.run == 'true'

      - name: Enable KVM
        if: steps.changes.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot and test APK
        if: steps.changes.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package=io.github.dixonsolutions.godnotic
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          diagnostics() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo 'Last 200 logcat lines:'
              adb logcat -d -v threadtime | tail -200 || true
              echo 'Last 200 lines mentioning the package:'
              adb logcat -d -v threadtime | grep -F "$package" | tail -200 || true
              adb exec-out screencap -p > smoke-failure.png || true
            fi
            exit "$status"
          }
          trap diagnostics EXIT
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-31;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd -n smoke -k 'system-images;android-31;google_apis;x86_64' --force
          booted=false
          for attempt in 1 2; do
            emulator -avd smoke -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > emulator.log 2>&1 &
            emulator_pid=$!
            if timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 5; done'; then
              booted=true
              break
            fi
            echo "Emulator boot timed out (attempt $attempt)"
            kill "$emulator_pid" || true
            wait "$emulator_pid" || true
            adb kill-server || true
          done
          if [ "$booted" != true ]; then
            cat emulator.log
            # Infrastructure, not the APK: say so loudly and let the release through.
            # A boot that succeeds and then crashes still fails the job below.
            echo "::warning::emulator did not boot; the APK boot check was SKIPPED for this run"
            exit 0
          fi
          adb logcat -c
          mapfile -t apks < <(find apk -name '*.apk' -type f)
          [ "${#apks[@]}" -eq 1 ]
          adb install -r "${apks[0]}"
          adb shell monkey -p "$package" 1
          sleep 20
          adb logcat -d -v threadtime > smoke-logcat.txt
          python3 - <<'PYCODE'
          import collections, re, sys
          logs = collections.defaultdict(list)
          for line in open('smoke-logcat.txt', errors='replace'):
              match = re.match(r'^\S+\s+\S+\s+(\d+)\s+\d+\s+\S\s+AndroidRuntime\s*:', line)
              if match:
                  logs[match.group(1)].append(line)
          for lines in logs.values():
              text = ''.join(lines)
              if 'io.github.dixonsolutions.godnotic' in text and ('FATAL EXCEPTION' in text or 'AndroidRuntime' in text):
                  print(text, file=sys.stderr)
                  sys.exit(1)
          PYCODE
          adb shell pidof "$package" | grep -q '[0-9]'

      - name: Upload failure screenshot
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-failure
          path: smoke-failure.png
          if-no-files-found: warn
