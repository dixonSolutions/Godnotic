[package]
name = "godnotic-loader"
description = "Godnotic loader for Linux: GTK 4 / libadwaita renderer of the engine's UI bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "godnotic-loader"
path = "src/main.rs"

[dependencies]
godnotic-loader-core = { path = "../core", features = ["http-ureq", "portal"] }
# The Flatpak runs on GNOME 50 (GTK 4.20, libadwaita 1.9); the features stay at
# GTK 4.18 and libadwaita 1.7 so the app also runs on older GNOME runtimes.
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
serde_json = "1"
libc = "0.2"
